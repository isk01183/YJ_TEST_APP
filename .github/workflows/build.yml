name: Build APK

# main 브랜치에 push 하거나, Actions 탭에서 수동 실행(Run workflow) 하면 자동으로 빌드됩니다.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 러너에 내장된 Android SDK를 사용합니다 (GitHub ubuntu-latest 이미지에 기본 포함됨).
      - name: Gradle 8.6 설치
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: 디버그 APK 빌드
        run: gradle assembleDebug --stacktrace

      - name: APK를 다운로드 가능한 아티팩트로 업로드
        uses: actions/upload-artifact@v4
        with:
          name: ChargingApp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
